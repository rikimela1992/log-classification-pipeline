{% extends "base.html" %}
{% block title %}Sign in · Log Classification Pipeline{% endblock %}
{% block content %}
<section class="panel login-panel">
  <p class="eyebrow">Private local workspace</p>
  <h1>Sign in</h1>
  <p class="muted">Use the organization and account created from the local CLI.</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form action="/app/login" method="post" class="stack" data-secure-form>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Organization<input name="organization" autocomplete="organization" required></label>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
