{% extends "base.html" %}
{% block title %}{{ t("login.title") }} · {{ t("app.title") }}{% endblock %}
{% block content %}
<section class="panel login-panel">
  <p class="eyebrow">{{ t("login.eyebrow") }}</p>
  <h1>{{ t("login.title") }}</h1>
  <p class="muted">{{ t("login.help") }}</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form action="/app/login" method="post" class="stack" data-secure-form>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t("login.organization") }}<input name="organization" autocomplete="organization" required></label>
    <label>{{ t("login.username") }}<input name="username" autocomplete="username" required></label>
    <label>{{ t("login.password") }}<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">{{ t("login.submit") }}</button>
  </form>
</section>
{% endblock %}
