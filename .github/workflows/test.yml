name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  web-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install web and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[web,test]'

      - name: Run complete suite with web integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -W error -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install released surfaces and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[web,test,quality]'

      - name: Lint maintained Python sources
        run: ruff check src tests examples packaging

      - name: Scan Python sources for medium and high severity findings
        run: bandit -q -r src -ll

      - name: Enforce branch coverage
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          coverage run -m unittest discover -s tests
          coverage report

      - name: Audit resolved dependencies
        run: pip-audit --local --skip-editable --progress-spinner off
