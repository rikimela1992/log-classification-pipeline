name: Bug report
description: Report a reproducible defect using synthetic, non-sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real logs, credentials, infrastructure identifiers, or private data.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include minimal commands and synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
