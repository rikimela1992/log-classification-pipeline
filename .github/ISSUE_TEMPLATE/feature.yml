name: Feature request
description: Propose a bounded improvement or roadmap item.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and privacy boundaries
      description: Describe data, deployment, or trust-boundary implications.
    validations:
      required: true
