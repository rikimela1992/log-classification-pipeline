<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Optional model and interface path</title>
  <desc id="desc">The command line and local interface share fail-closed services, select either a rules baseline or offline zero-shot encoder, and emit privacy-minimal predictions and synthetic metrics.</desc>
  <defs>
    <marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.choice{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.result{fill:#ecfdf5;stroke:#059669;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow-model)}.title{font:600 17px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.badge{font:600 13px system-ui,sans-serif;fill:#991b1b}</style>
  </defs>
  <rect x="25" y="20" width="248" height="34" rx="17" fill="#fee2e2"/><text x="149" y="42" text-anchor="middle" class="badge">ALPHA · LOCAL DEMO ONLY</text>
  <rect x="40" y="120" width="180" height="92" rx="12" class="box"/><text x="130" y="154" text-anchor="middle" class="title">CLI or local UI</text><text x="130" y="180" text-anchor="middle" class="small">same application path</text>
  <rect x="270" y="105" width="210" height="122" rx="12" class="box"/><text x="375" y="142" text-anchor="middle" class="title">Fail-closed core</text><text x="375" y="169" text-anchor="middle" class="small">validate · bound · chunk</text><text x="375" y="194" text-anchor="middle" class="small">one output per input</text>
  <rect x="530" y="70" width="220" height="82" rx="12" class="choice"/><text x="640" y="104" text-anchor="middle" class="title">Rules baseline</text><text x="640" y="128" text-anchor="middle" class="small">deterministic wiring check</text>
  <rect x="530" y="186" width="220" height="82" rx="12" class="choice"/><text x="640" y="220" text-anchor="middle" class="title">Zero-shot encoder</text><text x="640" y="244" text-anchor="middle" class="small">pinned · offline-first</text>
  <rect x="800" y="105" width="175" height="122" rx="12" class="result"/><text x="887" y="142" text-anchor="middle" class="title">Prediction</text><text x="887" y="169" text-anchor="middle" class="small">labels + scores</text><text x="887" y="194" text-anchor="middle" class="small">no source message</text>
  <rect x="1025" y="120" width="150" height="92" rx="12" class="result"/><text x="1100" y="154" text-anchor="middle" class="title">Evaluation</text><text x="1100" y="180" text-anchor="middle" class="small">synthetic only</text>
  <path d="M220 166 H270" class="line"/><path d="M480 145 H505 V111 H530" class="line"/><path d="M480 187 H505 V227 H530" class="line"/>
  <path d="M750 111 H775 V145 H800" class="line"/><path d="M750 227 H775 V187 H800" class="line"/><path d="M975 166 H1025" class="line"/>
</svg>
