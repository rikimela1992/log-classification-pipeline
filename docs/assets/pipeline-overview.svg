<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Fail-closed batch pipeline overview</title>
  <desc id="desc">Synthetic JSONL passes through bounded validation and prediction stages before atomic publication. Local model artifacts have a separate manifest verification gate. Any pre-publication failure leaves the destination unpublished.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.gate{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.commit{fill:#ecfdf5;stroke:#059669;stroke-width:2}.failure{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.fail-line{fill:none;stroke:#dc2626;stroke-width:2;marker-end:url(#arrow)}.label{font:600 16px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.badge{font:600 13px system-ui,sans-serif;fill:#991b1b}
    </style>
  </defs>
  <rect x="24" y="20" width="248" height="34" rx="17" fill="#fee2e2"/><text x="148" y="42" text-anchor="middle" class="badge">ALPHA · NOT PRODUCTION-READY</text>
  <rect x="35" y="120" width="150" height="82" rx="12" class="box"/><text x="110" y="151" text-anchor="middle" class="label">Synthetic JSONL</text><text x="110" y="176" text-anchor="middle" class="small">untrusted bytes</text>
  <rect x="235" y="105" width="190" height="112" rx="12" class="gate"/><text x="330" y="137" text-anchor="middle" class="label">Whole-file gate</text><text x="330" y="162" text-anchor="middle" class="small">byte + record limits</text><text x="330" y="184" text-anchor="middle" class="small">UTF-8 + strict JSON</text>
  <rect x="475" y="105" width="190" height="112" rx="12" class="gate"/><text x="570" y="137" text-anchor="middle" class="label">Predictor chunks</text><text x="570" y="162" text-anchor="middle" class="small">selected adapter</text><text x="570" y="184" text-anchor="middle" class="small">bounded output read</text>
  <rect x="715" y="105" width="190" height="112" rx="12" class="gate"/><text x="810" y="137" text-anchor="middle" class="label">Contract + stage</text><text x="810" y="162" text-anchor="middle" class="small">one output per input</text><text x="810" y="184" text-anchor="middle" class="small">hidden temporary file</text>
  <rect x="955" y="105" width="210" height="112" rx="12" class="commit"/><text x="1060" y="137" text-anchor="middle" class="label">Atomic publication</text><text x="1060" y="162" text-anchor="middle" class="small">file fsync → commit</text><text x="1060" y="184" text-anchor="middle" class="small">directory fsync</text>
  <path d="M185 161 H235" class="line"/><path d="M425 161 H475" class="line"/><path d="M665 161 H715" class="line"/><path d="M905 161 H955" class="line"/>
  <rect x="355" y="310" width="490" height="76" rx="12" class="failure"/><text x="600" y="340" text-anchor="middle" class="label">Pre-publication failure</text><text x="600" y="365" text-anchor="middle" class="small">predictor is not called after input failure · no destination is published</text>
  <path d="M330 217 V270 H500 V310" class="fail-line"/><path d="M570 217 V310" class="fail-line"/><path d="M810 217 V270 H700 V310" class="fail-line"/>
</svg>
