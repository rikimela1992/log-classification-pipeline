<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Verified local model artifact flow</title>
  <desc id="desc">A selected model profile and an external manifest are checked against every relevant file in a local model directory. A mismatch fails closed. A successful tree digest enters prediction provenance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.profile{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.verified{fill:#ecfdf5;stroke:#059669;stroke-width:2}.failure{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.fail{fill:none;stroke:#dc2626;stroke-width:2;marker-end:url(#arrow)}.label{font:600 16px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.mono{font:13px ui-monospace,SFMono-Regular,monospace;fill:#166534}.badge{font:700 13px system-ui,sans-serif;fill:#991b1b}
    </style>
  </defs>
  <rect x="24" y="20" width="248" height="34" rx="17" fill="#fee2e2"/><text x="148" y="42" text-anchor="middle" class="badge">ALPHA · NOT PRODUCTION-READY</text>
  <rect x="40" y="105" width="190" height="110" rx="12" class="box"/><text x="135" y="138" text-anchor="middle" class="label">Local model</text><text x="135" y="164" text-anchor="middle" class="small">weights + tokenizer</text><text x="135" y="187" text-anchor="middle" class="small">outside the repository</text>
  <rect x="40" y="265" width="190" height="110" rx="12" class="profile"/><text x="135" y="298" text-anchor="middle" class="label">Selected profile</text><text x="135" y="324" text-anchor="middle" class="small">model + revision</text><text x="135" y="347" text-anchor="middle" class="small">prompt configuration</text>
  <rect x="290" y="105" width="210" height="110" rx="12" class="box"/><text x="395" y="138" text-anchor="middle" class="label">External manifest</text><text x="395" y="164" text-anchor="middle" class="small">sorted file list</text><text x="395" y="187" text-anchor="middle" class="small">size + SHA-256</text>
  <rect x="560" y="105" width="230" height="175" rx="12" class="profile"/><text x="675" y="140" text-anchor="middle" class="label">Fail-closed verifier</text><text x="675" y="170" text-anchor="middle" class="small">profile identity matches</text><text x="675" y="195" text-anchor="middle" class="small">no links or special files</text><text x="675" y="220" text-anchor="middle" class="small">all relevant bytes copied</text><text x="675" y="245" text-anchor="middle" class="small">private snapshot re-verified</text>
  <rect x="850" y="105" width="310" height="110" rx="12" class="verified"/><text x="1005" y="138" text-anchor="middle" class="label">Bound loading + provenance</text><text x="1005" y="168" text-anchor="middle" class="mono">artifact_sha256</text><text x="1005" y="191" text-anchor="middle" class="small">framework reads the private copy</text>
  <rect x="850" y="300" width="310" height="76" rx="12" class="failure"/><text x="1005" y="330" text-anchor="middle" class="label">Mismatch or unsafe entry</text><text x="1005" y="354" text-anchor="middle" class="small">model is not loaded</text>
  <path d="M230 160H290" class="line"/><path d="M500 160H560" class="line"/><path d="M230 320H470V255H560" class="line"/><path d="M790 160H850" class="line"/><path d="M675 280V338H850" class="fail"/>
</svg>
