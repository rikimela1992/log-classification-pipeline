<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Atomic publication state machine</title>
  <desc id="desc">A hidden temporary file becomes file-synced, committed, and durable. Failures before commit are uncommitted; failures after commit explicitly report a visible destination.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
    <style>
      .state{fill:#f8fafc;stroke:#334155;stroke-width:2}.visible{fill:#ecfdf5;stroke:#059669;stroke-width:2}.error{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.fail{fill:none;stroke:#dc2626;stroke-width:2;marker-end:url(#arrow)}.title{font:600 17px system-ui,sans-serif;fill:#0f172a}.text{font:14px system-ui,sans-serif;fill:#475569}.error-text{font:600 14px system-ui,sans-serif;fill:#991b1b}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">Publication states on a local POSIX-like filesystem</text>
  <rect x="35" y="110" width="210" height="104" rx="12" class="state"/><text x="140" y="145" text-anchor="middle" class="title">PREPARE</text><text x="140" y="172" text-anchor="middle" class="text">temporary file hidden</text><text x="140" y="194" text-anchor="middle" class="text">mode applied</text>
  <rect x="330" y="110" width="210" height="104" rx="12" class="state"/><text x="435" y="145" text-anchor="middle" class="title">FILE SYNCED</text><text x="435" y="172" text-anchor="middle" class="text">content + mode staged</text><text x="435" y="194" text-anchor="middle" class="text">destination absent</text>
  <rect x="625" y="110" width="230" height="104" rx="12" class="visible"/><text x="740" y="145" text-anchor="middle" class="title">COMMITTED</text><text x="740" y="172" text-anchor="middle" class="text">destination visible</text><text x="740" y="194" text-anchor="middle" class="text">link or replace</text>
  <rect x="940" y="110" width="220" height="104" rx="12" class="visible"/><text x="1050" y="145" text-anchor="middle" class="title">DURABLE</text><text x="1050" y="172" text-anchor="middle" class="text">directory fsynced</text><text x="1050" y="194" text-anchor="middle" class="text">publication complete</text>
  <path d="M245 162 H330" class="line"/><text x="287" y="149" text-anchor="middle" class="text">fchmod + fsync</text>
  <path d="M540 162 H625" class="line"/><text x="582" y="137" text-anchor="middle" class="text">no overwrite: link</text><text x="582" y="154" text-anchor="middle" class="text">overwrite: replace</text>
  <path d="M855 162 H940" class="line"/><text x="897" y="149" text-anchor="middle" class="text">dir fsync</text>
  <rect x="100" y="345" width="365" height="92" rx="12" class="error"/><text x="282" y="378" text-anchor="middle" class="error-text">PRE-COMMIT ERROR</text><text x="282" y="404" text-anchor="middle" class="text">cleanup attempted · destination absent</text>
  <rect x="690" y="345" width="410" height="92" rx="12" class="error"/><text x="895" y="378" text-anchor="middle" class="error-text">POST-COMMIT ERROR</text><text x="895" y="404" text-anchor="middle" class="text">destination visible · committed exception</text>
  <path d="M435 214 V285 H282 V345" class="fail"/><path d="M740 214 V345" class="fail"/><path d="M1050 214 V285 H895 V345" class="fail"/>
  <text x="895" y="468" text-anchor="middle" class="text">PublicationCleanupError or PublicationDurabilityError</text>
</svg>
