[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-classification-pipeline"
version = "0.1.0a1"
description = "Fail-closed batch-processing foundation for log classification"
authors = [{ name = "Riccardo Melini" }]
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
ml = [
    "sentencepiece>=0.2,<1",
    "torch>=2.4,<3",
    "transformers>=4.48,<6",
]
ui = ["gradio>=6.0,<7"]
web = [
    "fastapi>=0.141,<0.158",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.52,<0.55",
]
test = ["httpx2>=2.9,<3"]
quality = [
    "bandit>=1.9,<2",
    "coverage[toml]>=7.10,<8",
    "pip-audit>=2.10,<3",
    "ruff>=0.14,<0.18",
]
demo = [
    "gradio>=6.0,<7",
    "sentencepiece>=0.2,<1",
    "torch>=2.4,<3",
    "transformers>=4.48,<6",
]

[project.scripts]
log-classify = "log_classification_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log_classification_pipeline = [
    "web/static/*.css",
    "web/static/*.js",
    "web/templates/*.html",
    "web/locales/*.json",
]

[tool.coverage.run]
branch = true
source = ["log_classification_pipeline"]

[tool.coverage.report]
fail_under = 85
skip_covered = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
