[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-classification-pipeline"
version = "0.1.0a1"
description = "Fail-closed batch-processing foundation for log classification"
authors = [{ name = "Riccardo Melini" }]
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
ml = [
    "sentencepiece>=0.2,<1",
    "torch>=2.4,<3",
    "transformers>=4.48,<6",
]
ui = ["gradio>=6.0,<7"]
demo = [
    "gradio>=6.0,<7",
    "sentencepiece>=0.2,<1",
    "torch>=2.4,<3",
    "transformers>=4.48,<6",
]

[project.scripts]
log-classify = "log_classification_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
